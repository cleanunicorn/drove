name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A red main never releases: semantic-release waits for lint, type-check and
  # tests on this exact commit.
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  release:
    name: Semantic Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      # Run on the host so build_command can use the same uv installation.
      # PSR 9 runs on Python 3.12; drove and its lock retain Python 3.14.
      - name: Version, prepare reviewed notes and refresh lock
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --python 3.12 --from python-semantic-release==9.21.2 semantic-release version --no-changelog --no-vcs-release

      # Also runs on a retry with no new bump: publish the tagged notes if the
      # preceding run pushed the tag but failed to create the GitHub Release.
      - name: Publish tagged release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project --python 3.14 python scripts/release.py publish --version "$RELEASE_VERSION"
