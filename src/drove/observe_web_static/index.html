<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drove observe</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header>
  <h1>▌drove observe</h1>
  <span class="filter">{{FILTER_LABEL}}</span>
  <input id="search" class="search" type="search" aria-label="Search requests" placeholder="Search anything…" autocomplete="off">
  <button id="refresh-btn">Refresh</button>
</header>
<div class="main">
  <section class="list-pane" id="list-pane" aria-label="Requests" aria-busy="false">
    <div class="list-summary">
      <p id="record-count" hidden></p>
      <p id="list-status" role="status" aria-live="polite"></p>
      <button type="button" id="list-retry" hidden>Retry</button>
    </div>
    <div id="list" aria-label="Recorded requests"></div>
    <div class="list-footer">
      <button id="load-more-btn" hidden>Load more</button>
    </div>
  </section>
  <section class="detail-pane" id="detail" aria-label="Request details" aria-busy="false">
    <div class="detail-placeholder">Select a request from the list to inspect.</div>
  </section>
</div>
<script src="static/app.js"></script>
</body>
</html>
